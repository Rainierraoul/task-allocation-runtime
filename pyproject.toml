[project]
name = "dcarr-runtime"
version = "0.2.0"
description = "Task models from DCARR's Describe phase, run across deterministic tools, small models, reasoning models and people"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic"]
test = ["pytest", "numpy"]
study = ["numpy>=1.26", "torch>=2.2", "transformers>=4.40,<5", "huggingface-hub>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
